<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>ОСАГО</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    /* Надпись с версией: между «Закрыть» и «•••» */
    #ver {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
      height: var(--tg-content-safe-area-inset-top, 44px);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 600 14px -apple-system, Helvetica, Arial, sans-serif;
      color: #222;
      pointer-events: none;
      z-index: 10;
    }

    /* единственная прокручиваемая область */
    #scroller {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 44px));
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) + 16px);
    }

    #ppdwi {
      display: block;
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      height: 650px;
      border: none;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

  <div id="ver">v1.223</div>

  <div id="scroller">
    <iframe
      src="https://b2c.pampadu.ru/index.html#377d763e-f276-4ef0-8e95-60898c3dc4af"
      id="ppdwi"
      scrolling="yes"
      allow="clipboard-write">
    </iframe>
  </div>

  <script src="https://b2c.pampadu.ru/ppdw.js"></script>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    try {
      if (tg.isVersionAtLeast('8.0') && ['ios', 'android'].includes(tg.platform)) {
        tg.requestFullscreen();
      }
    } catch (e) {}
    try {
      tg.setBackgroundColor('#ffffff');
      tg.setHeaderColor('#ffffff');
    } catch (e) {}
  </script>

</body>
</html>
