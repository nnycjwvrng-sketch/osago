<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ОСАГО</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    /* обычная прокрутка страницы, без overflow:hidden и без фиксированной высоты */
    body {
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    /* отступ под шапку Telegram в полноэкранном режиме */
    #top-space {
      height: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
    }

    /* отступ снизу под системную полосу iPhone */
    #bottom-space {
      height: calc(var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) + 16px);
    }

    /* высоту выставляет ppdw.js, мы задаём только стартовую */
    #ppdwi {
      display: block;
      width: 100%;
      min-width: 320px;
      height: 650px;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <div id="top-space"></div>

  <iframe
    src="https://b2c.pampadu.ru/index.html#377d763e-f276-4ef0-8e95-60898c3dc4af"
    id="ppdwi"
    scrolling="no"
    allow="clipboard-write">
  </iframe>

  <div id="bottom-space"></div>

  <script src="https://b2c.pampadu.ru/ppdw.js"></script>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}

    try {
      if (tg.isVersionAtLeast('8.0') && ['ios', 'android'].includes(tg.platform)) {
        tg.requestFullscreen();
      }
    } catch (e) {}

    try {
      tg.setBackgroundColor('#ffffff');
      tg.setHeaderColor('#ffffff');
    } catch (e) {}
  </script>

</body>
</html>
