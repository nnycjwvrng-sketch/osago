
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ОСАГО онлайн</title>

  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--tg-theme-bg-color, #fff);
    }

    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    #ppdwi {
      display: block;
      width: 100%;
      height: 100%;
      height: var(--tg-viewport-stable-height, 100dvh);
      border: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
  </style>
</head>

<body>

  <iframe
    src="https://b2c.pampadu.ru/index.html#377d763e-f276-4ef0-8e95-60898c3dc4af"
    id="ppdwi"
    title="Расчет ОСАГО"
    scrolling="yes">
  </iframe>

  <script src="https://b2c.pampadu.ru/ppdw.js"></script>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Не даем Telegram перехватывать свайпы формы
      if (tg.isVersionAtLeast('7.7')) {
        tg.disableVerticalSwipes();
      }

      // Обновляем размеры при изменении окна Mini App
      const frame = document.getElementById('ppdwi');

      tg.onEvent('viewportChanged', () => {
        frame.style.height =
          `${tg.viewportStableHeight || tg.viewportHeight}px`;
      });

      frame.style.height =
        `${tg.viewportStableHeight || tg.viewportHeight}px`;
    }
  </script>

</body>
</html>
