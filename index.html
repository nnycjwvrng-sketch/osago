<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ОСАГО</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      overscroll-behavior: none;
      /* отступ под шапку Telegram и системные зоны */
      padding-top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
      padding-bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    }

    #ppdwi {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <iframe
    src="https://b2c.pampadu.ru/index.html#377d763e-f276-4ef0-8e95-60898c3dc4af"
    id="ppdwi"
    scrolling="yes"
    allow="clipboard-write">
  </iframe>

  <script src="https://b2c.pampadu.ru/ppdw.js"></script>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // Свайп вниз больше не сворачивает приложение (Bot API 7.7+)
    try {
      if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    } catch (e) {}

    // Полный экран (Bot API 8.0+), только на телефонах
    try {
      if (tg.isVersionAtLeast('8.0') &&
          ['ios', 'android'].includes(tg.platform)) {
        tg.requestFullscreen();
      }
    } catch (e) {}

    // Цвета под вашу страницу (подставьте свой, если фон виджета не белый)
    try {
      tg.setBackgroundColor('#ffffff');
      tg.setHeaderColor('#ffffff');
    } catch (e) {}
  </script>

</body>
</html>
