
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>ОСАГО онлайн</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--tg-theme-bg-color, #fff);
    }

    body {
      position: fixed;
      inset: 0;
    }

    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--tg-viewport-height, 100dvh);
      overflow: hidden;
    }

    #ppdwi {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
  </style>
</head>

<body>

  <div id="app">
    <iframe
      id="ppdwi"
      src="https://b2c.pampadu.ru/index.html#377d763e-f276-4ef0-8e95-60898c3dc4af"
      scrolling="yes"
      title="ОСАГО">
    </iframe>
  </div>

  <script src="https://b2c.pampadu.ru/ppdw.js"></script>

  <script>
    const tg = window.Telegram.WebApp;
    const app = document.getElementById('app');

    tg.ready();

    // Разворачиваем приложение
    tg.expand();

    // Запрещаем сворачивание свайпом вниз
    if (tg.isVersionAtLeast('7.7')) {
      tg.disableVerticalSwipes();
    }

    // Включаем полноэкранный режим, если поддерживается
    if (tg.isVersionAtLeast('8.0')) {
      tg.requestFullscreen();
    }

    // Подстраиваем высоту под Telegram WebView
    function updateHeight() {
      app.style.height =
        (tg.viewportHeight || window.innerHeight) + 'px';
    }

    updateHeight();

    tg.onEvent('viewportChanged', updateHeight);

  </script>

</body>
</html>
