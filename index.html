<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ОСАГО</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff;
      overflow: hidden; /* скроллится только содержимое iframe */
    }

    #ppdwi {
      position: fixed;
      left: 0;
      right: 0;
      /* под шапку Telegram в полноэкранном режиме */
      top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
      /* под системную полосу iPhone */
      bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      width: 100%;
      height: auto;
      border: none;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <iframe
    src="https://b2c.pampadu.ru/index.html#377d763e-f276-4ef0-8e95-60898c3dc4af"
    id="ppdwi"
    scrolling="yes"
    allow="clipboard-write">
  </iframe>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}

    try {
      if (tg.isVersionAtLeast('8.0') && ['ios', 'android'].includes(tg.platform)) {
        tg.requestFullscreen();
      }
    } catch (e) {}

    try {
      tg.setBackgroundColor('#ffffff');
      tg.setHeaderColor('#ffffff');
    } catch (e) {}
  </script>

</body>
</html>
